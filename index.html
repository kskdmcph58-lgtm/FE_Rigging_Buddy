<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <style>
    /* Paint the theme base before external styles or fonts arrive. */
    html { color-scheme: dark; background-color: var(--bg, #101e20); }
    html.fonts-loading body { visibility: hidden; }
  </style>
  <meta name="app-version" content="{{ site.github.build_revision }}">
  <link rel="preload" href="assets/fonts/wlqs-system-cn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/wlqs-number.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/wlqs-level-up.woff2" as="font" type="font/woff2" crossorigin>
  <script>{% include update-check.js %}</script>
  <title>Rigging Buddy · 万缕千丝</title>
  <link rel="stylesheet" href="ui/styles/theme.css?v={{ site.github.build_revision }}">
  <link rel="stylesheet" href="styles.css?v={{ site.github.build_revision }}">
  <link rel="stylesheet" href="ui/styles/motion.css?v={{ site.github.build_revision }}">
  <script>
    // Wait for the custom fonts without changing which elements use them.
    if (document.fonts) {
      document.documentElement.classList.add('fonts-loading');
      document.addEventListener('DOMContentLoaded', async () => {
        const timeout = setTimeout(() => document.documentElement.classList.remove('fonts-loading'), 15000);
        try {
          await Promise.all([
            document.fonts.load('16px "WLQS System CN"', '万缕千丝 Rigging Buddy'),
            document.fonts.load('16px "WLQS Number"', '0123456789+-'),
            document.fonts.load('16px "WLQS Level Up"', 'Level Up 0123456789')
          ]);
        } catch (error) {
          // A failed font request must not leave the application inaccessible.
          console.warn('Unable to load game fonts', error);
        } finally {
          clearTimeout(timeout);
          document.documentElement.classList.remove('fonts-loading');
        }
      }, { once: true });
    }
  </script>
  <script defer src="characters.js?v={{ site.github.build_revision }}"></script>

  <script defer src="ui/summary-rails.js?v={{ site.github.build_revision }}"></script>

  <script defer src="ui/record-interactions.js?v={{ site.github.build_revision }}"></script>

  <script defer src="ui/summary.js?v={{ site.github.build_revision }}"></script>
